<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" fill="none">
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#164675" opacity=".16"/>
    </pattern>
  </defs>

  <!-- DIAGONAL STRIPE MODULE -->
  <g opacity=".95">
    <rect x="590" y="22" width="26" height="26" transform="rotate(45 603 35)" fill="#FF7A00"/>
    <rect x="620" y="52" width="26" height="26" transform="rotate(45 633 65)" fill="#163F70"/>
    <rect x="650" y="82" width="26" height="26" transform="rotate(45 663 95)" fill="#FF7A00"/>
    <rect x="680" y="112" width="26" height="26" transform="rotate(45 693 125)" fill="#163F70"/>
  </g>

  <!-- LARGE TARGET / ORBIT -->
  <g transform="translate(575 225)">
    <circle cx="0" cy="0" r="86" stroke="#163F70" stroke-width="2" opacity=".22"/>
    <circle cx="0" cy="0" r="62" stroke="#FF7A00" stroke-width="2" opacity=".48"/>
    <circle cx="0" cy="0" r="38" stroke="#163F70" stroke-width="2" opacity=".48"/>
    <circle cx="0" cy="0" r="12" fill="#FF7A00"/>
    <circle cx="-58" cy="-28" r="6" fill="white" stroke="#163F70" stroke-width="2"/>
    <circle cx="54" cy="-42" r="6" fill="white" stroke="#FF7A00" stroke-width="2"/>
    <circle cx="48" cy="48" r="6" fill="white" stroke="#163F70" stroke-width="2"/>
  </g>

  <!-- CONNECTED NETWORK, CLEARLY STRUCTURED -->
  <g stroke="#163F70" stroke-width="2" opacity=".38">
    <path d="M350 90 L430 150 L505 95 L575 145"/>
    <path d="M430 150 L390 225 L470 285 L540 240"/>
    <path d="M505 95 L575 145 L650 125"/>
    <path d="M470 285 L540 340 L620 305"/>
  </g>
  <g fill="white" stroke="#163F70" stroke-width="2">
    <circle cx="350" cy="90" r="6"/>
    <circle cx="430" cy="150" r="6"/>
    <circle cx="505" cy="95" r="6"/>
    <circle cx="575" cy="145" r="6"/>
    <circle cx="390" cy="225" r="6"/>
    <circle cx="470" cy="285" r="6"/>
    <circle cx="540" cy="240" r="6"/>
    <circle cx="540" cy="340" r="6"/>
    <circle cx="620" cy="305" r="6"/>
  </g>

  <!-- DIAMOND BADGE -->
  <g transform="translate(465 95)">
    <rect x="-30" y="-30" width="60" height="60" transform="rotate(45)" stroke="#FF7A00" stroke-width="2"/>
    <rect x="-17" y="-17" width="34" height="34" transform="rotate(45)" fill="#163F70"/>
    <rect x="-9" y="-9" width="18" height="18" transform="rotate(45)" fill="#FF7A00"/>
  </g>

  <!-- HEXAGON BADGE -->
  <g transform="translate(385 330)">
    <polygon points="0,-34 30,-17 30,17 0,34 -30,17 -30,-17"
             stroke="#163F70" stroke-width="2" opacity=".48"/>
    <polygon points="0,-17 15,-8.5 15,8.5 0,17 -15,8.5 -15,-8.5"
             fill="#163F70"/>
  </g>

  <!-- CORNER FRAME -->
  <g stroke="#FF7A00" stroke-width="2.5" opacity=".6">
    <path d="M650 40 H785 V120"/>
    <path d="M680 70 H755 V105"/>
    <path d="M710 145 H790 V205"/>
  </g>
  <g fill="#FF7A00">
    <rect x="776" y="112" width="10" height="10"/>
    <rect x="745" y="97" width="10" height="10"/>
  </g>

  <!-- DOT FIELD -->
  <rect x="650" y="300" width="150" height="150" fill="url(#dots)" opacity=".9"/>

  <!-- BOTTOM GEOMETRIC MODULE -->
  <g transform="translate(610 430)">
    <rect x="-70" y="-12" width="24" height="24" transform="rotate(45)" fill="#FF7A00"/>
    <rect x="-35" y="-12" width="24" height="24" transform="rotate(45)" fill="#163F70"/>
    <rect x="0" y="-12" width="24" height="24" transform="rotate(45)" fill="#FF7A00"/>
    <rect x="35" y="-12" width="24" height="24" transform="rotate(45)" fill="#163F70"/>
    <rect x="70" y="-12" width="24" height="24" transform="rotate(45)" fill="#FF7A00"/>
  </g>

  <!-- THIN DIAGONAL ACCENTS -->
  <g stroke-linecap="round">
    <path d="M300 405 L405 300" stroke="#163F70" stroke-width="5" opacity=".18"/>
    <path d="M650 510 L760 400" stroke="#FF7A00" stroke-width="5" opacity=".45"/>
    <path d="M675 530 L785 420" stroke="#163F70" stroke-width="5" opacity=".25"/>
  </g>
</svg>